<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shitjet - Inventar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--ac:#0a7d4f;--bd:#e0e0e5;--dg:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ac:#30c27c;--bd:#2c2c2e;--dg:#ff6b5e}}
:root[data-theme="dark"]{--bg:#111;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ac:#30c27c;--bd:#2c2c2e;--dg:#ff6b5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.top input{font-size:20px;font-weight:700;background:transparent;border:0;color:var(--tx);width:100%;min-width:0;padding:4px 0}
.logo{flex:none;width:64px;height:64px;border-radius:14px;border:2px dashed var(--bd);background:var(--card) center/contain no-repeat;color:var(--mu);font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden}
.logo.has{border-style:solid}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--mu)}
.stats .low{color:var(--dg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.deal{border:0;border-radius:16px;background:var(--ac);color:#fff;padding:22px 8px;font-size:15px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.deal b{font-size:30px}
.deal:active{transform:scale(.97)}
.deal.opt{background:var(--card);color:var(--tx);border:2px dashed var(--ac)}
.opts{display:none;gap:8px;margin-bottom:14px}.opts.on{display:flex}
.opts input,.row input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
button.s{padding:12px 16px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.log div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.log div:last-child{border:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
h3{margin:0 0 8px;font-size:14px;color:var(--mu);font-weight:600}
.cal{display:flex;gap:8px;margin-bottom:6px}.cal input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.hint{font-size:12px;color:var(--mu);margin-bottom:12px}.deal.bk{background:#2563eb}.pay h3{color:var(--tx);font-size:16px;text-align:center;margin-bottom:12px}.stats{row-gap:14px}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <input id="name" placeholder="Emri i produktit" maxlength="40">
    <label class="logo" id="logo">+ Logo<input type="file" id="file" accept="image/*" hidden></label>
  </div>

  <div class="cal"><button class="g" id="prev">‹</button><input type="date" id="day"><button class="g" id="next">›</button><button class="g" id="today">Sot</button></div>
  <div class="hint">Dita: 07:00 – 05:00 (e nesërmja)</div>
  <div class="card stats">
    <div><b id="vc">0€</b><span>💵 Cash</span></div>
    <div><b id="vb">0€</b><span>💳 Bank</span></div>
    <div><b id="vt">0€</b><span>Total</span></div>
    <div><b id="sold">0</b><span>Copë (dita)</span></div>
    <div><b id="cnt">0</b><span>Shitje</span></div>
    <div><b id="st">0</b><span>Stoku mbetur</span></div>
  </div>

  <div class="grid">
    <button class="deal" data-q="1" data-p="40"><b>1</b>copë · 40€</button>
    <button class="deal" data-q="2" data-p="70"><b>2</b>copë · 70€</button>
    <button class="deal" data-q="3" data-p="100"><b>3</b>copë · 100€</button>
    <button class="deal opt" id="optb"><b>＋</b>Opsional</button>
  </div>
  <div class="opts" id="opts">
    <input id="oq" type="number" min="1" inputmode="numeric" placeholder="Copë">
    <input id="op" type="number" min="0" inputmode="decimal" placeholder="Çmimi €">
    <button class="s" id="ob">Vazhdo</button>
  </div>
  <div class="card pay" id="pay" style="display:none"><h3 id="pt"></h3><div class="grid" style="margin:0"><button class="deal" id="cash"><b>💵</b>Cash</button><button class="deal bk" id="bank"><b>💳</b>Bank</button></div><button class="g" id="pc" style="margin-top:10px;width:100%">Anulo</button></div>

  <div class="card">
    <h3>Shto stok</h3>
    <div class="row"><input id="add" type="number" min="1" inputmode="numeric" placeholder="Sa copë po shton?"><button class="s" id="addb">Shto</button></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">Shitjet e fundit</h3><button class="g" id="undo">↩ Anulo të fundit</button></div>
    <div class="log" id="log"></div>
  </div>
  <div style="text-align:center;margin-bottom:24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="g" id="reset">Fshi gjithçka</button></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBk2Ej9sK2K8H7mKM3L5kInZi4q5M-QDyk",
    authDomain: "inventar-9.firebaseapp.com",
    projectId: "inventar-9",
    storageBucket: "inventar-9.firebasestorage.app",
    messagingSenderId: "742689976771",
    appId: "1:742689976771:web:cc95221d1726aa06074d76",
    measurementId: "G-ZDTN3D1XD7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let S = { name: "", stock: 0, logo: "", sales: [] };
  let $=function(i){return document.getElementById(i)};
  let P=null, D;

  function pad(n){return n<10?"0"+n:""+n}
  function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function dk(t){return ds(new Date(t-5*3600000))}
  D = dk(Date.now());

  async function loadData() {
    try {
      const docRef = doc(db, "inventar_data", "aktive");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        S = docSnap.data();
      }
    } catch(e) { console.error("Gabim gjatë leximit:", e); }
    render();
  }

  async function saveData() {
    try {
      await setDoc(doc(db, "inventar_data", "aktive"), S);
    } catch(e) { console.error("Gabim gjatë ruajtjes:", e); }
  }

  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},1600)}
  function fmt(n){return (Math.round(n*100)/100)+"€"}

  function render(){
    $("name").value = S.name || "";
    var l = $("logo"); l.style.backgroundImage = S.logo ? "url("+S.logo+")" : ""; l.classList.toggle("has", !!S.logo);
    l.firstChild.textContent = S.logo ? "" : "+ Logo";
    $("day").value = D;
    var q=0, c=0, b=0, n=0, h="";
    var st = $("st"); st.textContent = S.stock || 0; st.className = (S.stock || 0) <= 5 ? "low" : "";
    
    if (S.sales) {
      S.sales.slice().reverse().forEach(function(s){
        if(dk(s.t) !== D) return;
        q += s.q; n++; var bk = s.m === "bank";
        if(bk) b += s.p; else c += s.p;
        h += "<div><span>" + s.q + " copë · " + (bk?"💳":"💵") + " · " + new Date(s.t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) + "</span><b>" + fmt(s.p) + "</b></div>";
      });
    }
    $("vc").textContent = fmt(c); $("vb").textContent = fmt(b); $("vt").textContent = fmt(c+b); $("sold").textContent = q; $("cnt").textContent = n;
    $("log").innerHTML = h || '<span style="color:var(--mu);font-size:14px">Pa shitje këtë ditë</span>';
  }

  function sell(q, p){
    if(!(q>0)||!(p>=0)||p!==p){toast("Vendos vlera të sakta");return}
    if((S.stock || 0) < q){toast("Stok i pamjaftueshëm (" + S.stock + ")");return}
    P={q:q, p:p}; $("pt").textContent = q + " copë · " + fmt(p) + " — si paguhet?"; $("pay").style.display="block"; $("pay").scrollIntoView({block:"nearest"});
  }

  async function pay(m){
    if(!P) return;
    S.stock = (S.stock || 0) - P.q;
    if(!S.sales) S.sales = [];
    S.sales.push({q: P.q, p: P.p, m: m, t: Date.now()});
    D = dk(Date.now());
    await saveData();
    render();
    toast("✓ " + (m==="bank"?"Bank":"Cash") + " · " + fmt(P.p));
    P = null; $("pay").style.display = "none";
  }

  $("cash").onclick = function(){pay("cash")};
  $("bank").onclick = function(){pay("bank")};
  $("pc").onclick = function(){P=null; $("pay").style.display="none"};
  document.querySelectorAll(".deal[data-q]").forEach(function(b){b.onclick=function(){sell(+b.dataset.q, +b.dataset.p)}});
  $("optb").onclick = function(){$("opts").classList.toggle("on"); $("oq").focus()};
  $("ob").onclick = function(){sell(parseInt($("oq").value), parseFloat($("op").value)); $("oq").value=""; $("op").value=""};
  
  $("addb").onclick = async function(){
    var n = parseInt($("add").value);
    if(n>0){
      S.stock = (S.stock || 0) + n;
      $("add").value = "";
      await saveData();
      render();
      toast("+" + n + " në stok");
    }
  };

  $("undo").onclick = async function(){
    if(S.sales && S.sales.length > 0){
      var s = S.sales.pop();
      S.stock = (S.stock || 0) + s.q;
      await saveData();
      render();
      toast("U anulua");
    }
  };

  $("reset").onclick = async function(){
    if(confirm("Të fshihet çdo gjë?")){
      S = {name: S.name, stock: 0, logo: S.logo, sales: []};
      await saveData();
      render();
    }
  };

  function shift(n){var d = new Date(D+"T12:00:00"); d.setDate(d.getDate()+n); D = ds(d); render()}
  $("prev").onclick = function(){shift(-1)};
  $("next").onclick = function(){shift(1)};
  $("today").onclick = function(){D = dk(Date.now()); render()};
  $("day").onchange = function(){if(this.value){D = this.value; render()}};
  
  $("name").oninput = async function(){
    S.name = this.value;
    await saveData();
  };

  $("file").onchange = function(){
    var f = this.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      var im = new Image();
      im.onload = async function(){
        var c = document.createElement("canvas"), k = Math.min(1, 160/Math.max(im.width, im.height));
        c.width = im.width * k; c.height = im.height * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        S.logo = c.toDataURL("image/png");
        await saveData();
        render();
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };

  loadData();
</script>
</body>
</html>
